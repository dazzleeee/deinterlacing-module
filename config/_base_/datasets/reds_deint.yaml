dataset:
  train:
    type: 'RedsDeintDataset'
    root_dir: 'data/REDS_link'
    split: 'train'
    seq_len: 15
    crop_lr: 64
    augment: true
    use_lmdb: true
    batch_size: 4
    num_workers: 4
  val:
    type: 'RedsDeintDataset'
    root_dir: 'data/REDS_link'
    split: 'val'
    seq_len: 30
    crop_lr: null
    augment: false
    use_lmdb: true
    batch_size: 1
    num_workers: 2